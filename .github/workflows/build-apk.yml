name: Build APK and AAB

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the source code from the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK) 17 (Temurin distribution)
      # This version supports the Gradle 9.3.1 used in this project
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Step 3: Grant execute permission to the Gradle wrapper script
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Step 4: Build the Debug APK
      # Artifact will be generated at app/build/outputs/apk/debug/app-debug.apk
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      # Step 5: Build the Release Android App Bundle (Unsigned)
      # Artifact will be generated at app/build/outputs/bundle/release/app-release.aab
      - name: Build Release AAB
        run: ./gradlew :app:bundleRelease

      # Step 6: Upload the Debug APK as a build artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Step 7: Upload the Release AAB as a build artifact
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab
