name: Build APK and AAB

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

      - name: Install required Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36.1" \
            "build-tools;36.1.0" \
            "platform-tools"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      # Pull requests (including forks) get a debug build only; secrets are not exposed.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Check release signing secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64 Actions secret" >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD Actions secret" >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS Actions secret" >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD Actions secret" >&2; exit 1; }

      - name: Decode upload keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fx-journal-upload-key.jks"
          chmod 600 "$RUNNER_TEMP/fx-journal-upload-key.jks"

      - name: Build signed release AAB
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew :app:bundleRelease
        env:
          FX_UPLOAD_STORE_FILE: ${{ runner.temp }}/fx-journal-upload-key.jks
          FX_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FX_UPLOAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FX_UPLOAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release AAB
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove temporary upload keystore
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rm -f "$RUNNER_TEMP/fx-journal-upload-key.jks"
